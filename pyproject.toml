[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habapp_rules"
description = "Basic rules for HABApp"
long_description = "Basic rules for HABApp"
authors = [{ name = "Seuling N." }]
license = "EUPL-1.2"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "habapp==26.9.0",
    "jinja2>=3.1.6",
    "matplotlib~=3.10.0",
    "multi-notifier~=0.6.2",
    "pydantic_extra_types~=2.11.0",
    "transitions==0.9.1", # > 0.9 creates strange graphs
    "typing-extensions==4.16.0", # used for py3.10 support (SelfType)
    "wakeonlan~=3.3.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "graphviz~=0.21.0",
    "pytest~=8.4.1",
    "ruff~=0.15.0",
    "pytest~=8.4.1",
    "prek>=0.1.0",
    "coverage>=7.11.0",
    "requests>=2.33.1",
    "mypy>=1.20.2",
    "types-python-dateutil>=2.9.0.20260408",
]


[tool.coverage]
branch = true
concurrency = "thread"
context = "(empty)"
disable_warnings = ["module-not-imported"]
dynamic_context = "test_function"
source = ["habapp_rules", "tests"]
omit = ["*oh_item.py", "*rule_runner.py", "*run_unittest.py", "*__version__.py"]


[tool.coverage.exclude_lines]
pragma = "no cover"
if_main = "if __name__ == \"__main__\":"
if_typing = "if typing.TYPE_CHECKING:"
typing_overload = "@(typing.)?overload"

[tool.coverage.report]
fail_under = 100
skip_covered = true
omit = [
    "*/helper/graph_machines.py",
    "*oh_item.py",
    "*rule_runner.py",
    "*run_unittest.py",
    "tests/helper/async_helper.py"
]


[tool.hatch.build.targets.wheel]
include = ["habapp_rules"]

[tool.hatch.envs.lint]
detached = true
dependencies = ["prek"]
[tool.hatch.envs.lint.scripts]
check = "prek run --all-files"

[tool.hatch.envs.publish]
detached = true

[tool.hatch.metadata] # remove when HABApp dev is released
allow-direct-references = true

[tool.hatch.version]
path = "habapp_rules/__init__.py"

[tool.ruff]
indent-width = 4
line-length = 250
preview = true
exclude = ["*rule_runner.py"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma", # Missing trailing commas
    "CPY", # Missing copyright notice
    "undocumented-public-module", # Missing docstring in public module
    "undocumented-public-package", # Missing docstring in public package
    "incorrect-blank-line-before-class", # 1 blank line required before class docstring
    "multi-line-summary-second-line", # Multi-line docstring summary should start at the second line
    "docstring-extraneous-exception", # Raised exception is not explicitly raised
    "call-datetime-without-tzinfo", # datetime.datetime() called without a tzinfo argument
    "call-datetime-now-without-tzinfo", # datetime.datetime.now() called without a tz argument
    "call-datetime-fromtimestamp", # datetime.datetime.fromtimestamp() called without a tz argument
    "datetime-min-max", # Use of datetime.datetime.{min_max} without timezone information
    "line-too-long", # Line too long
    "boolean-type-hint-positional-argument", # Boolean-typed positional argument in function definition
    "boolean-default-value-positional-argument", # Boolean default positional argument in function definition
    "logging-f-string", # Logging statement uses f-string
    "single-line-implicit-string-concatenation", # Implicitly concatenated string literals on one line
    "PD", # Pandas
    "too-many-return-statements", # Too many return statements
    "too-many-arguments", # Too many arguments in function definition
    "too-many-positional-arguments", # Too many positional arguments
    "non-empty-init-module", # __init__ should only contain docstrings and re-exports
]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
# Ignore certain rules in the 'tests/' directory
"tests/*" = [
    "any-type", # Dynamically typed expressions (typing.Any) are disallowed
    "call-datetime-without-tzinfo", # datetime.datetime() called without a tzinfo argument
    "call-datetime-today", # datetime.datetime.today() used
    "call-datetime-now-without-tzinfo", # datetime.datetime.now() called without a tz argument
    "boolean-positional-value-in-call", # Boolean-typed keyword argument in function call
    "import-private-name", # Private name import
    "too-many-statements", # Too many statements
    "magic-value-comparison", # Magic value used in comparison
    "too-many-public-methods", # Too many public methods
    "no-self-use", # Method could be a function, class method, or static method
    "PT", # pytest style -> this pkg is using unittest
    "collections-named-tuple", # Use typing.NamedTuple instead of collections.namedtuple
    "assert", # Use of assert detected
    "private-member-access", # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ['pydantic.mypy']
