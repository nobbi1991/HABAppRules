name: Prek auto-update

on:
  # every day at midnight
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Install prek
        run: uv tool install prek
      - name: Update prek hooks
        id: update-hooks
        run: |
          git status --porcelain > /tmp/before.txt
          prek autoupdate
          git status --porcelain > /tmp/after.txt
          if diff /tmp/before.txt /tmp/after.txt > /dev/null; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
      - name: Increment bugfix version
        id: version-bump
        if: steps.update-hooks.outputs.updated == 'true'
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import urllib.request

          with urllib.request.urlopen('https://pypi.org/pypi/habapp_rules/json') as response:
              pypi_version = json.loads(response.read())['info']['version']

          with open('habapp_rules/__init__.py', 'r') as f:
              content = f.read()

          version_match = re.search(r'__version__ = "(\d+)\.(\d+)\.(\d+)"', content)
          if not version_match:
              print("Could not find version in __init__.py")
              bumped = False
          else:
              current_version = f"{version_match.group(1)}.{version_match.group(2)}.{version_match.group(3)}"
              if current_version != pypi_version:
                  print(f"Branch version ({current_version}) differs from PyPI version ({pypi_version}), skipping bump")
                  bumped = False
              else:
                  major, minor, patch = version_match.groups()
                  new_version = f"{major}.{minor}.{int(patch) + 1}"
                  content = re.sub(r'__version__ = "\d+\.\d+\.\d+"', f'__version__ = "{new_version}"', content)
                  with open('habapp_rules/__init__.py', 'w') as f:
                      f.write(content)
                  print(f"Updated version to {new_version}")
                  bumped = True

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"bumped={'true' if bumped else 'false'}\n")
          EOF
      - name: Update changelog
        if: steps.update-hooks.outputs.updated == 'true' && steps.version-bump.outputs.bumped == 'true'
        run: |
          python - << 'EOF'
          import re
          from datetime import datetime

          # Read current version
          with open('habapp_rules/__init__.py', 'r') as f:
              content = f.read()
              version_match = re.search(r'__version__ = "(\d+\.\d+\.\d+)"', content)
              if version_match:
                  version = version_match.group(1)

          # Get today's date
          today = datetime.now().strftime('%d.%m.%Y')

          # Add new entry to changelog
          with open('changelog.md', 'r') as f:
              changelog = f.read()

          new_entry = f"# Version {version} - {today}\n\n## Project related\n\n- updated prek hooks to latest versions\n\n"

          changelog = new_entry + changelog

          with open('changelog.md', 'w') as f:
              f.write(changelog)

          print("Updated changelog")
          EOF
      - uses: peter-evans/create-pull-request@v8
        if: steps.update-hooks.outputs.updated == 'true'
        with:
          branch: update/prek-hooks
          title: Update prek hooks and increment version
          labels: 'prek, automated'
          commit-message: "chore: update prek hooks and increment patch version"
          body: Update versions of prek hooks to latest version and increment patch version.
          add-paths: |
            prek.toml
            habapp_rules/__init__.py
            changelog.md
          delete-branch: true
